<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TVMS Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold fs-3">

            <i class="fa-solid fa-car"></i>

            TVMS

        </a>

        <div class="d-flex align-items-center">

            <span id="clock" class="text-light me-4"></span>

            <span id="status" class="badge bg-danger">

                Offline

            </span>

        </div>

    </div>

</nav>


<!-- ================= CONTENT ================= -->

<div class="container-fluid mt-4">

    <!-- Sensor Cards -->

    <div class="row g-4">

        <div class="col-lg-3">
            <div class="sensor-card">
                <i class="fa-solid fa-temperature-half icon"></i>
                <h6>Temperature</h6>
                <h2 id="temperature">-- °C</h2>
            </div>
        </div>

        <div class="col-lg-3">
            <div class="sensor-card">
                <i class="fa-solid fa-droplet icon"></i>
                <h6>Humidity</h6>
                <h2 id="humidity">-- %</h2>
            </div>
        </div>

        <div class="col-lg-3">
            <div class="sensor-card">
                <i class="fa-solid fa-gauge-high icon"></i>
                <h6>Pressure</h6>
                <h2 id="pressure">--</h2>
            </div>
        </div>

        <div class="col-lg-3">
            <div class="sensor-card">
                <i class="fa-solid fa-battery-three-quarters icon"></i>
                <h6>Voltage</h6>
                <h2 id="voltage">-- V</h2>
            </div>
        </div>

    </div>

    <div class="row g-4 mt-2">

        <div class="col-lg-3">
            <div class="sensor-card">
                <i class="fa-solid fa-bolt icon"></i>
                <h6>Current</h6>
                <h2 id="current">-- A</h2>
            </div>
        </div>

        <div class="col-lg-9">
            <div class="sensor-card">

                <h5>Accelerometer</h5>

                <div class="row text-center">

                    <div class="col">
                        <h6>X</h6>
                        <h2 id="x">0</h2>
                    </div>

                    <div class="col">
                        <h6>Y</h6>
                        <h2 id="y">0</h2>
                    </div>

                    <div class="col">
                        <h6>Z</h6>
                        <h2 id="z">0</h2>
                    </div>

                </div>

            </div>
        </div>

    </div>

    <!-- Charts -->

    <div class="row mt-4">

        <div class="col-lg-12">

            <div class="chart-card">

                <h5>Temperature</h5>

                <canvas id="tempChart"></canvas>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-lg-6">

            <div class="chart-card">

                <h5>Pressure</h5>

                <canvas id="pressureChart"></canvas>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="chart-card">

                <h5>Battery</h5>

                <canvas id="batteryChart"></canvas>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-lg-12">

            <div class="chart-card">

                <h5>Accelerometer</h5>

                <canvas id="accelChart"></canvas>

            </div>

        </div>

    </div>

</div>

<footer>

    TVMS V2.0 |
    STM32F407 |
    ESP32 |
    MQTT |
    Flask |
    MySQL

</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
